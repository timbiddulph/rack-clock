# Chrony NTP Server Configuration for Rack Clock
# This allows the Pi to serve time to local network devices

# Upstream NTP servers to sync from
server pool.ntp.org iburst
server time.google.com iburst
server time.cloudflare.com iburst
server time.nist.gov iburst

# Record the rate at which the system clock gains/losses time
driftfile /var/lib/chrony/drift

# Allow NTP client access from local network
# Adjust these to match your network(s)
allow 192.168.0.0/16
allow 10.0.0.0/8
allow 172.16.0.0/12

# Serve time even if not synchronized to upstream (stratum 10)
local stratum 10

# Log files
logdir /var/log/chrony

# Step clock if offset is greater than 1 second (first 3 updates only)
makestep 1 3

# Enable hardware timestamping if available
hwtimestamp *

# Specify directory for Unix socket
bindcmdaddress /run/chrony/chronyd.sock
